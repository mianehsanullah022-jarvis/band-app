name: Build iPhone app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Make Xcode project
        run: xcodegen generate

      - name: Build app (unsigned)
        run: |
          xcodebuild -project BandApp.xcodeproj -scheme BandApp \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Pack .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Band.app Payload/
          zip -qry Band.ipa Payload
          ls -la Band.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Band-ipa
          path: Band.ipa

      - name: Publish download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Band app (latest)
          body: Download Band.ipa and install it with Sideloadly.
          files: Band.ipa
          make_latest: true
